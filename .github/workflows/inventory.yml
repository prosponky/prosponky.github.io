name: Refresh public inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,12 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
concurrency:
  group: inventory-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect complete public inventory
        run: |
          node scripts/collect-dealerrater.mjs
          node scripts/collect-dealerrater.mjs coggin-atlantic
          node scripts/collect-dealerrater.mjs coggin-avenues
      - name: Collect official Coggin customer cash and links
        continue-on-error: true
        run: node scripts/collect-coggin-offers.mjs
      # Greenway official prices are verified in the supported local browser by
      # the 7 a.m./noon Codex heartbeat. This host is denied by the dealer; never
      # replace its verified map with syndicated or partial pricing.
      - name: Publish refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          cp public/inventory/*.json inventory/
          git config user.name 'Pocket Desking inventory'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add inventory/*.json
          git diff --cached --quiet || git commit -m 'Refresh all store inventories'
          published=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              published=true
              break
            fi
            echo "Publish collided with another update; retrying ($attempt/5)."
            sleep "$attempt"
          done
          if [ "$published" != true ]; then
            echo "::error::Inventory publish failed after five attempts. Existing live inventory is unchanged."
            exit 1
          fi
          gh api --method POST repos/${{ github.repository }}/pages/builds






