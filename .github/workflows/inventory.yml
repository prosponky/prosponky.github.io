name: Refresh public inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/New_York'
    - cron: '0 12 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
concurrency:
  group: inventory-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start from latest published inventory evidence
        run: |
          mkdir -p public/inventory
          cp inventory/*.json public/inventory/
      - name: Collect complete public inventory
        run: |
          node scripts/collect-dealerrater.mjs
          node scripts/collect-dealerrater.mjs coggin-atlantic
          node scripts/collect-dealerrater.mjs coggin-avenues
      - name: Collect official Coggin customer cash and links
        id: official-coggin
        continue-on-error: true
        run: node scripts/collect-coggin-offers.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free PDF text verifier
        run: python -m pip install pypdf==6.1.1
      - name: Retain published sticker checkpoints
        run: |
          for file in inventory/*-stickers.json; do
            if [ -f "$file" ]; then cp "$file" public/inventory/; fi
          done
      - name: Window sticker collection is paced separately (five vehicles per day)
        id: official-stickers
        continue-on-error: true
        env:
          STICKER_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/refresh-window-stickers.mjs
      - name: Record individual official collection outcomes
        if: always()
        env:
          COGGIN_OUTCOME: ${{ steps.official-coggin.outcome }}
          STICKER_OUTCOME: ${{ steps.official-stickers.outcome }}
        run: |
          mkdir -p tmp
          node -e 'require("fs").writeFileSync("tmp/official-step-outcomes.json",JSON.stringify({checkedAt:new Date().toISOString(),coggin:process.env.COGGIN_OUTCOME,stickers:process.env.STICKER_OUTCOME}))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-sticker-collection-report
          path: |
            tmp/sticker-refresh-latest.json
            tmp/official-step-outcomes.json
          if-no-files-found: ignore
      # Greenway official prices are verified in the supported local browser by
      # the 7 a.m./noon Codex heartbeat. This host is denied by the dealer; never
      # replace its verified map with syndicated or partial pricing.
      - name: Publish refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          cp public/inventory/*.json inventory/
          git config user.name 'Pocket Desking inventory'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add inventory/*.json
          git diff --cached --quiet || git commit -m 'Refresh all store inventories'
          published=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              published=true
              break
            fi
            echo "Publish collided with another update; retrying ($attempt/5)."
            sleep "$attempt"
          done
          if [ "$published" != true ]; then
            echo "::error::Inventory publish failed after five attempts. Existing live inventory is unchanged."
            exit 1
          fi
          gh api --method POST repos/${{ github.repository }}/pages/builds







