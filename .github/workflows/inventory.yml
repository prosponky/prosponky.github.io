name: Refresh public inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/New_York'
    - cron: '0 12 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
concurrency:
  group: inventory-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start from latest published inventory evidence
        run: |
          mkdir -p public/inventory
          cp inventory/*.json public/inventory/
      - name: Refresh Greenway public inventory
        id: greenway
        continue-on-error: true
        run: node scripts/collect-dealerrater.mjs greenway
      - name: Refresh Atlantic public inventory
        id: atlantic
        continue-on-error: true
        run: node scripts/collect-dealerrater.mjs coggin-atlantic
      - name: Refresh Avenues public inventory
        id: avenues
        continue-on-error: true
        run: node scripts/collect-dealerrater.mjs coggin-avenues
      - name: Collect official Atlantic prices and links
        id: official-atlantic
        continue-on-error: true
        run: node scripts/collect-coggin-offers.mjs coggin-atlantic
      - name: Collect official Avenues prices and links
        id: official-avenues
        continue-on-error: true
        run: node scripts/collect-coggin-offers.mjs coggin-avenues
      # Greenway and AutoNation official evidence still use the supported local browser.
      - name: Publish successful complete snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GREENWAY: ${{ steps.greenway.outcome }}
          ATLANTIC: ${{ steps.atlantic.outcome }}
          AVENUES: ${{ steps.avenues.outcome }}
          OFFICIAL_ATLANTIC: ${{ steps.official-atlantic.outcome }}
          OFFICIAL_AVENUES: ${{ steps.official-avenues.outcome }}
        run: |
          files=()
          [ "$GREENWAY" != success ] || files+=(greenway.json)
          [ "$ATLANTIC" != success ] || files+=(coggin-atlantic.json)
          [ "$AVENUES" != success ] || files+=(coggin-avenues.json)
          [ "$OFFICIAL_ATLANTIC" != success ] || files+=(coggin-atlantic-links.json)
          [ "$OFFICIAL_AVENUES" != success ] || files+=(coggin-avenues-links.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No complete fresh snapshots; previous evidence retained.'; exit 1; fi
          node scripts/publish-inventory-snapshots.mjs "${files[@]}"
          gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Report freshness for each source
        if: always()
        env:
          GREENWAY: ${{ steps.greenway.outcome }}
          ATLANTIC: ${{ steps.atlantic.outcome }}
          AVENUES: ${{ steps.avenues.outcome }}
          OFFICIAL_ATLANTIC: ${{ steps.official-atlantic.outcome }}
          OFFICIAL_AVENUES: ${{ steps.official-avenues.outcome }}
        run: |
          printf '| Source | Outcome |\n|---|---|\n| Greenway | %s |\n| Atlantic | %s |\n| Avenues | %s |\n| Official Atlantic | %s |\n| Official Avenues | %s |\n' "$GREENWAY" "$ATLANTIC" "$AVENUES" "$OFFICIAL_ATLANTIC" "$OFFICIAL_AVENUES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GREENWAY" != success ] || [ "$ATLANTIC" != success ] || [ "$AVENUES" != success ]; then
            echo '::error::A public inventory source could not refresh. Other complete sources were published; prior evidence for the failed source was retained.'
            exit 1
          fi
          if [ "$OFFICIAL_ATLANTIC" != success ] || [ "$OFFICIAL_AVENUES" != success ]; then
            echo '::warning::Official pricing needs the scheduled local recovery. Previous verified prices remain available.'
          fi

